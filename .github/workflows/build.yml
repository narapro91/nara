name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "lambda/**"
      - ".github/workflows/build.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: asset-proxy

permissions:
  id-token: write   # OIDC token for aws-actions/configure-aws-credentials
  contents: read

jobs:
  build:
    name: Build Docker Image and Push to ECR
    runs-on: ubuntu-latest

    outputs:
      image_uri: ${{ steps.build-push.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── AWS credentials via OIDC (no long-lived keys stored) ──────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Ensure ECR repository exists ───────────────────────────────────────
      - name: Create ECR repository if it does not exist
        run: |
          aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" 2>/dev/null || \
          aws ecr create-repository \
            --repository-name "$ECR_REPOSITORY" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability IMMUTABLE \
            --region "$AWS_REGION"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build & push image tagged with immutable Git SHA ──────────────────
      - name: Build, tag, and push Docker image
        id: build-push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            --tag "${IMAGE_URI}" \
            ./lambda

          docker push "${IMAGE_URI}"

          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      # ── Trigger the deploy workflow with the new image URI ─────────────────
      - name: Trigger deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'deploy.yml',
              ref:   context.ref,
              inputs: {
                image_uri: '${{ steps.build-push.outputs.image_uri }}'
              }
            })
